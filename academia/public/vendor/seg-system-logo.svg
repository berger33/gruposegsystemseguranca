<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Grupo SEG System</title>
  <desc id="logo-description">Emblema em escudo do Grupo SEG System Segurança Integrada.</desc>
  <defs>
    <path id="outer-shield" d="M12 9h216v148c0 16-8 28-23 35l-85 40-85-40c-15-7-23-19-23-35z"/>
    <path id="inner-shield" d="M20 17h200v138c0 12-7 22-20 28l-80 37-80-37c-13-6-20-16-20-28z"/>
    <path id="brand-star" d="M0-9 2.65-2.75 9-2.15 4.2 2.15 5.35 9 0 5.8-5.35 9-4.2 2.15-9-2.15-2.65-2.75Z"/>
    <path id="lower-ribbon-text" d="M40 182Q120 242 200 182"/>
  </defs>

  <!-- Solid blue silhouette and inset white face keep the outside edge clean at every size. -->
  <use href="#outer-shield" fill="#173a7a"/>
  <use href="#inner-shield" fill="#fff"/>

  <!-- Nameplate. -->
  <path d="M20 17h200v31H20z" fill="#1d4084"/>
  <use href="#brand-star" transform="translate(35 32) scale(.72)" fill="#fff"/>
  <use href="#brand-star" transform="translate(205 32) scale(.72)" fill="#fff"/>
  <text x="120" y="39" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing=".35" textLength="111" lengthAdjust="spacingAndGlyphs">GRUPO</text>

  <!-- Original interior stars, drawn fully inside the white face. -->
  <path d="m66 66 3.5 7.4 8.1 1.1-5.9 5.7 1.4 8-7.1-3.8-7.2 3.8 1.4-8-5.8-5.7 8-1.1z" fill="#fff" stroke="#8995a7" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="m174 139 3.5 7.4 8.1 1.1-5.9 5.7 1.4 8-7.1-3.8-7.2 3.8 1.4-8-5.8-5.7 8-1.1z" fill="#fff" stroke="#8995a7" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Diagonal wordmark, inset from the shield edge; no white keyline. -->
  <path d="M38 127 202 77v34L38 161z" fill="#1d4084"/>
  <text x="120" y="127" text-anchor="middle" transform="rotate(-17 120 127)" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="italic" font-weight="700" textLength="138" lengthAdjust="spacingAndGlyphs">SEG SYSTEM</text>

  <!-- Lower band is inset from the outer contour, so the white face cannot peek through its edges. -->
  <path d="M34 170Q76 194 120 204Q164 194 206 170L206 190Q163 213 120 221Q77 213 34 190Z" fill="#1d4084"/>
  <text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing=".1">
    <textPath href="#lower-ribbon-text" startOffset="50%" text-anchor="middle" textLength="151" lengthAdjust="spacingAndGlyphs">SEGURANÇA INTEGRADA</textPath>
  </text>
</svg>
