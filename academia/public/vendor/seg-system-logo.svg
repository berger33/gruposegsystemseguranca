<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Grupo SEG System</title>
  <desc id="logo-description">Emblema azul e branco do Grupo SEG System Segurança Integrada.</desc>
  <defs>
    <path id="shield" d="M12 9h216v150c0 15-8 26-22 33l-86 40-86-40c-14-7-22-18-22-33z"/>
    <path id="lower-ribbon-text" d="M26 173Q120 259 214 173"/>
    <path id="star" d="M0-9 2.65-2.75 9-2.15 4.2 2.15 5.35 9 0 5.8-5.35 9-4.2 2.15-9-2.15-2.65-2.75Z"/>
  </defs>

  <!-- The white is the shield's intentional face; everything outside the shield stays transparent. -->
  <use href="#shield" fill="#fff"/>

  <!-- Top nameplate and the two framed side columns from the supplied company mark. -->
  <path d="M15 13h210v33H15z" fill="#1d4084"/>
  <path d="M15 46h29v120q-15-6-29-13zM196 46h29v107q-14 7-29 13z" fill="#1d4084"/>
  <path d="M22 53v99m7-99v102m167-102v99m7-99v102" fill="none" stroke="#fff" stroke-width="2" opacity=".96"/>

  <g fill="#fff">
    <use href="#star" transform="translate(31 29) scale(.72)"/>
    <use href="#star" transform="translate(209 29) scale(.72)"/>
  </g>
  <text x="120" y="36" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing=".35" textLength="111" lengthAdjust="spacingAndGlyphs">GRUPO</text>

  <!-- The two small outlined stars are part of the original shield artwork. -->
  <path d="m65 65 3.5 7.4 8.1 1.1-5.9 5.7 1.4 8-7.1-3.8-7.2 3.8 1.4-8-5.8-5.7 8-1.1z" fill="#fff" stroke="#8995a7" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="m176 139 3.5 7.4 8.1 1.1-5.9 5.7 1.4 8-7.1-3.8-7.2 3.8 1.4-8-5.8-5.7 8-1.1z" fill="#fff" stroke="#8995a7" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Clean, solid diagonal band: no raster edge or fringe. -->
  <path d="m15 130 210-65v39L15 169z" fill="#1d4084" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <text x="120" y="128" text-anchor="middle" transform="rotate(-17 120 128)" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-style="italic" font-weight="700" textLength="145" lengthAdjust="spacingAndGlyphs">SEG SYSTEM</text>

  <!-- Lower blue ribbon and curved company descriptor. -->
  <path d="M14 160q49 27 106 43 57-16 106-43v21q-49 27-106 48-57-21-106-48z" fill="#1d4084"/>
  <text fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing=".1">
    <textPath href="#lower-ribbon-text" startOffset="50%" text-anchor="middle" textLength="177" lengthAdjust="spacingAndGlyphs">SEGURANÇA INTEGRADA</textPath>
  </text>

  <!-- Re-draw the clean outer contour above all interior elements. -->
  <use href="#shield" fill="none" stroke="#173a7a" stroke-width="6" stroke-linejoin="round"/>
</svg>
