name: UX clientes (admin) delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/admin/clientes/**'
      - 'src/components/ui/**'
      - 'src/lib/client-auth-core.mjs'
      - 'src/styles/ux-tokens.css'
      - 'src/server/client-space-api.mjs'
      - 'src/server/rbac.mjs'
      - 'server.mjs'
      - 'tests/helpers/**'
      - 'tests/ux-client-admin-workspace.integration.test.mjs'
      - 'scripts/qa-ux-client-admin-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/ux-client-admin-delivery.yml'
concurrency:
  group: ux-client-admin-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ux-client-admin-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Cadastros centrais de clientes — HTTP real, PostgreSQL descartável e Chromium
        run: npm run test:ux-client-admin:pg
