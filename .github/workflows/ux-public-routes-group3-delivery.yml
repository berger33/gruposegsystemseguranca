name: E6 rotas publicas - grupo 3 (raiz e previas)
on:
  pull_request:
    branches: [main]
    # Filtros precisos: e isso que faz o inventario UX-PRO-00 reconhecer este
    # workflow como gate de jornada da raiz, das dez previas de layout, da
    # comparacao e do indice QA. Nao usar src/** (viraria baseline).
    paths:
      - 'src/app/page.tsx'
      - 'src/app/layout-01/**'
      - 'src/app/layout-02/**'
      - 'src/app/layout-03/**'
      - 'src/app/layout-04/**'
      - 'src/app/layout-05/**'
      - 'src/app/layout-06/**'
      - 'src/app/layout-07/**'
      - 'src/app/layout-08/**'
      - 'src/app/layout-09/**'
      - 'src/app/layout-10/**'
      - 'src/app/layout-preview/**'
      - 'src/app/qa/modulos/**'
      - 'src/components/SiteVisualRenderer.tsx'
      - 'src/components/SitePreviewNotice.tsx'
      - 'src/components/DevelopmentPreviewNav.tsx'
      - 'src/components/PublicSite.tsx'
      - 'src/components/Layout*.tsx'
      - 'src/lib/site-visuals.*'
      - 'scripts/ux-pro-00-inventory.mjs'
      - 'scripts/qa-ux-public-routes-postgres.mjs'
      - 'scripts/lib/qa-pg-supervisor.mjs'
      - 'scripts/lib/qa-public-tap-audit.mjs'
      - 'scripts/qa-generated-files-guard.mjs'
      - 'scripts/qa-generated-files.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'tests/qa-pg-supervisor.test.mjs'
      - 'tests/qa-public-tap-audit.test.mjs'
      - 'tests/ux-pro-00-inventory.test.mjs'
      - 'tests/ux-public-routes.integration.test.mjs'
      - 'tests/ux-public-routes-group3-gate.test.mjs'
      - 'docs/UX-PRO-00-INVENTARIO-ROTAS-2026-10-13.csv'
      - 'docs/UX-PRO-00-MATRIZ-COBERTURA-2026-10-13.csv'
      - 'package.json'
      - '.github/workflows/ux-public-routes-group3-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      ALLOW_REMOTE_MIGRATIONS: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Supervisor PostgreSQL descartável
        run: node --test tests/qa-pg-supervisor.test.mjs
      - name: Auditor TAP das rotas públicas
        run: node --test tests/qa-public-tap-audit.test.mjs
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - name: Guarda estatica do grupo 3 e do inventario da raiz
        run: node --test tests/ux-public-routes-group3-gate.test.mjs tests/ux-pro-00-inventory.test.mjs
      - name: Inventario de rotas em dia
        run: node scripts/ux-pro-00-inventory.mjs --check
      - name: PostgreSQL 17 descartavel + Chromium (13 rotas restantes)
        run: node scripts/qa-ux-public-routes-postgres.mjs
        env:
          UX_PUBLIC_TEST_PATTERN: 'E6 grupo 3'
