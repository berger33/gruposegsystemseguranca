name: L05 Contract delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.mjs'
      - 'tests/l05-delivery.integration.test.mjs'
      - 'scripts/qa-l05-delivery-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'scripts/qa-wave0-static.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/l05-delivery.yml'
permissions:
  contents: read
jobs:
  contracts-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Migrations, replay and checksum in disposable PostgreSQL
        run: npm run test:migrations:pg
      - name: L05 real HTTP, disposable PostgreSQL and Chromium
        run: npm run test:l05-delivery:pg
