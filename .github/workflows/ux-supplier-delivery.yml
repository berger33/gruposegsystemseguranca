name: UX-09 fornecedores delivery
on:
  pull_request:
    paths: ['src/app/admin/fornecedores/**','src/lib/supplier-*','src/components/ui/**','tests/ux-supplier-*','tests/helpers/**','scripts/qa-ux-supplier-postgres.mjs','scripts/ux-evidence-capture.mjs','package.json','package-lock.json','scripts/lib/qa-pg-supervisor.mjs','scripts/qa-generated-files-guard.mjs','tests/qa-pg-supervisor.test.mjs','scripts/migrate-site-visual.mjs']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      ALLOW_REMOTE_MIGRATIONS: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      UX_SUPPLIER_TEST_PATTERN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node --test tests/qa-pg-supervisor.test.mjs
      - run: npm run typecheck
      - run: node --test tests/ux-supplier-vocabulary.test.mjs tests/ext04-suppliers.test.mjs
      - run: npm run test:ext04-suppliers:pg
      - run: npm run test:ux-supplier:pg
      - run: npm audit --audit-level=moderate
