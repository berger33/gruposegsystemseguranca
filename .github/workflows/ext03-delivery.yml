name: EXT-03 biddings delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/ext-bidding-api.mjs'
      - 'src/app/admin/licitacoes/**'
      - 'server.mjs'
      - 'tests/ext03-biddings.test.mjs'
      - 'tests/ext03-biddings.integration.test.mjs'
      - 'scripts/qa-ext03-biddings-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/ext03-delivery.yml'
concurrency:
  group: ext03-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  biddings-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ledger de migrações 001-149 em PostgreSQL descartável
        run: npm run test:migrations:pg
      - name: Jornada EXT-03 (licitações) por HTTP real contra PostgreSQL real
        run: npm run test:ext03-biddings:pg
