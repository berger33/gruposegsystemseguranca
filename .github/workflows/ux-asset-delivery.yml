name: UX asset delivery

on:
  pull_request:
    paths:
      - 'src/app/admin/patrimonio/**'
      - 'src/lib/asset-request.ts'
      - 'src/components/ui/**'
      - 'server.mjs'
      - 'src/server/ast-api.mjs'
      - 'src/server/ast-advanced-api.mjs'
      - 'tests/helpers/**'
      - 'tests/ux-asset-workspace.integration.test.mjs'
      - 'scripts/qa-ux-asset-postgres.mjs'
      - 'scripts/lib/qa-pg-supervisor.mjs'
      - 'scripts/lib/qa-tap-summary.mjs'
      - 'scripts/qa-generated-files-guard.mjs'
      - 'tests/qa-pg-supervisor.test.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'scripts/ux-pro-00-inventory.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/ux-asset-delivery.yml'
  workflow_dispatch:

concurrency:
  group: ux-asset-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  ux-asset-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      UX_ASSET_TEST_PATTERN: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guardas do supervisor antes de PG
        run: node --test tests/qa-pg-supervisor.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Patrimônio — HTTP real, PostgreSQL descartável e Chromium
        run: npm run test:ux-asset:pg
