name: UX emergency delivery

on:
  pull_request:
    paths:
      - 'src/app/admin/emergencial/**'
      - 'src/lib/emergency-request.ts'
      - 'src/components/ui/**'
      - 'server.mjs'
      - 'src/server/ext-emergency-api.mjs'
      - 'tests/helpers/**'
      - 'tests/ux-emergency-workspace.integration.test.mjs'
      - 'tests/ext15-emergency.integration.test.mjs'
      - 'tests/ext15-emergency.test.mjs'
      - 'scripts/qa-ux-emergency-postgres.mjs'
      - 'scripts/lib/qa-pg-supervisor.mjs'
      - 'scripts/lib/qa-tap-summary.mjs'
      - 'scripts/qa-generated-files-guard.mjs'
      - 'scripts/qa-generated-files.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'tests/qa-pg-supervisor.test.mjs'
      - 'scripts/ux-pro-00-inventory.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/ux-emergency-delivery.yml'
  workflow_dispatch:

concurrency:
  group: ux-emergency-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  ux-emergency-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      ALLOW_REMOTE_MIGRATIONS: ''
      OLLAMA_ENABLED: 'false'
      MAIL_HOST: ''
      UX_EMERGENCY_TEST_PATTERN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Supervisor PostgreSQL descartável
        run: node --test tests/qa-pg-supervisor.test.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Apoio emergencial — HTTP real, PostgreSQL descartável e Chromium
        run: npm run test:ux-emergency:pg
