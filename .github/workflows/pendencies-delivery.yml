name: Internal pendencies delivery
# Jornada sintética e caixa interna: não comprova entrega de notificação externa.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/ops-pendency-api.mjs'
      - 'src/server/ext-compliance-api.mjs'
      - 'src/server/ext-continuity-api.mjs'
      - 'src/app/admin/pendencias/**'
      - 'server.mjs'
      - 'tests/ops-pendencies*.test.mjs'
      - 'scripts/qa-ops-pendencies-postgres.mjs'
      - 'scripts/lib/qa-pg-supervisor.mjs'
      - 'scripts/qa-generated-files-guard.mjs'
      - 'tests/qa-pg-supervisor.test.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/pendencies-delivery.yml'
concurrency:
  group: pendencies-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  pendencies-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Contratos unitários de pendências e supervisor
        run: node --test tests/ops-pendencies.test.mjs tests/qa-pg-supervisor.test.mjs
      - name: Jornada de pendências por HTTP e PostgreSQL descartável
        run: npm run test:pendencies:pg
