name: UX-10 expansao delivery
on:
  pull_request:
    paths: ['src/app/admin/expansao/**','src/lib/expansion-*','tests/ux-expansion-*','scripts/qa-ux-expansion-postgres.mjs','scripts/ux-evidence-capture.mjs','package.json']
  workflow_dispatch:
jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/ux-expansion-vocabulary.test.mjs tests/ext09-expansion.test.mjs
      - run: npm run test:ext09-expansion:pg
      - run: npm run test:ux-expansion:pg
      - run: npm audit --audit-level=high
