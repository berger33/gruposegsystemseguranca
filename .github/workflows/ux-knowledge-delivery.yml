name: UX conhecimento delivery
# UX-07 / EXT-08 — apresentação canônica de /admin/conhecimento.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/admin/conhecimento/**'
      - 'src/components/ui/UiWorkspace.module.css'
      - 'src/lib/knowledge-vocabulary.*'
      - 'tests/ext08-knowledge.test.mjs'
      - 'tests/ext08-knowledge.integration.test.mjs'
      - 'tests/ux-knowledge-vocabulary.test.mjs'
      - 'tests/ux-knowledge-workspace.integration.test.mjs'
      - 'scripts/qa-ux-knowledge-postgres.mjs'
      - 'scripts/ux-evidence-capture.mjs'
      - 'docs/UX-07-CONHECIMENTO-2026-10-06.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ux-knowledge-delivery.yml'
concurrency:
  group: ux-knowledge-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ux-knowledge-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/ux-knowledge-vocabulary.test.mjs
      - run: node --test tests/ext08-knowledge.test.mjs
      - run: npm run test:ux-knowledge:pg
