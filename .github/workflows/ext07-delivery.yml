name: EXT-07 compliance hardening

on:
  pull_request:
    paths:
      - "db/migrations/154-ext07-compliance-hardening.sql"
      - "src/server/ext-compliance-api.mjs"
      - "src/app/admin/compliance/**"
      - "src/app/admin/ti/ExtAdvancedClient.tsx"
      - "server.mjs"
      - "tests/ext07-*"
      - "scripts/qa-ext07-compliance-postgres.mjs"
      - "scripts/migrate-site-visual.mjs"
      - "scripts/qa-wave0-static.mjs"
      - "package.json"
      - ".github/workflows/ext07-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ext07:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check src/server/ext-compliance-api.mjs
          node --check scripts/qa-ext07-compliance-postgres.mjs
          node --check tests/ext07-compliance.integration.test.mjs
      - run: node scripts/qa-wave0-static.mjs
      - run: npm run typecheck
      - run: node --test tests/ext07-compliance.test.mjs
      - name: PostgreSQL 17 + HTTP real + sessão staff
        run: npm run test:ext07-compliance:pg
