name: EXT-07 compliance delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/ext-compliance-api.mjs'
      - 'src/server/ext-advanced-api.mjs'
      - 'src/app/admin/compliance/**'
      - 'server.mjs'
      - 'tests/ext07-compliance*.test.mjs'
      - 'scripts/qa-ext07-compliance-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'scripts/qa-wave0-static.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/ext07-delivery.yml'
concurrency:
  group: ext07-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  compliance-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # O gate sobe o próprio cluster PostgreSQL 17 descartável: URLs herdadas são
    # recusadas de propósito, por isso não há service container aqui.
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Teste focal estático EXT-07
        run: node --test tests/ext07-compliance.test.mjs
      - name: Ledger de migrações 001-154 em PostgreSQL descartável
        run: npm run test:migrations:pg
      - name: Prova EXT-07 por HTTP real contra PostgreSQL 17 real
        run: npm run test:ext07-compliance:pg
      - name: next-env.d.ts e tsconfig.json intactos após a prova
        run: git diff --exit-code -- next-env.d.ts tsconfig.json
