name: EXT-07 compliance delivery

# A entrega anterior gravou `ton:` no lugar de `on:`: o workflow era invalido e
# nunca disparou. O gate dedicado sobe o proprio cluster PostgreSQL 17
# descartavel, entao nao ha `services:` nem URL herdada.
on:
  pull_request:
    paths:
      - 'db/migrations/153-ext07-compliance-journey.sql'
      - 'db/migrations/154-ext07-compliance-hardening.sql'
      - 'src/server/ext-compliance-api.mjs'
      - 'src/server/ext-advanced-api.mjs'
      - 'src/app/admin/compliance/**'
      - 'tests/ext07-compliance*.mjs'
      - 'scripts/qa-ext07-compliance-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'scripts/qa-wave0-static.mjs'
      - '.github/workflows/ext07-delivery.yml'
  workflow_dispatch:

jobs:
  ext07:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/qa-wave0-static.mjs
      - run: npm run typecheck
      - run: node --test tests/ext07-compliance.test.mjs
      # O gate recusa DATABASE_URL/DATABASE_MIGRATION_URL herdadas e falha,
      # em vez de pular, quando o PostgreSQL nao sobe.
      - run: npm run test:ext07-compliance:pg
        env:
          DATABASE_URL: ''
          DATABASE_MIGRATION_URL: ''
          NEXT_TELEMETRY_DISABLED: '1'
