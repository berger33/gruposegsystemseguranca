name: EXT-07 compliance delivery
# A chave de gatilho estava grafada como "ton:" na entrega anterior (PR #103),
# o que faz o GitHub ignorar o arquivo inteiro: o workflow nunca executou.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/ext-compliance-api.mjs'
      - 'src/server/ext-advanced-api.mjs'
      - 'src/app/admin/compliance/**'
      - 'server.mjs'
      - 'tests/ext07-compliance*.test.mjs'
      - 'scripts/qa-ext07-compliance-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'scripts/qa-wave0-static.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/ext07-delivery.yml'
  workflow_dispatch:
concurrency:
  group: ext07-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  compliance-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # O gate sobe o proprio PostgreSQL 17 descartavel e RECUSA qualquer banco
      # herdado do ambiente. Nao declare service container nem *_DATABASE_URL
      # aqui: a execucao aborta de proposito se encontrar um.
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Arvore, manifesto e ledger estatico (001-154)
        run: node scripts/qa-wave0-static.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Suite focal EXT-07 (sem banco)
        run: node --test tests/ext07-compliance.test.mjs
      - name: Ledger de migracoes em PostgreSQL descartavel (aplica, repete, checksums, negativo, clone)
        run: npm run test:migrations:pg
      - name: Jornada EXT-07 (compliance) por HTTP real contra PostgreSQL real
        run: npm run test:ext07-compliance:pg
      - name: Nao regressao EXT-06 (jornada reaproveitada)
        run: npm run test:ext06-satisfaction:pg
