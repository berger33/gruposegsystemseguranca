name: UX-08 Licitações
on:
  pull_request:
    paths:
      - 'src/app/admin/licitacoes/**'
      - 'src/lib/bidding-*'
      - 'src/server/ext-bidding-api.mjs'
      - 'server.mjs'
      - 'tests/ux-bidding-*'
      - 'scripts/qa-ux-bidding-postgres.mjs'
      - '.github/workflows/ux-bidding-delivery.yml'
      - 'package*.json'
jobs:
  ux-bidding:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/ux-bidding-vocabulary.test.mjs tests/ext03-biddings.test.mjs
      - run: npm run test:ux-bidding:pg
      - run: npm audit --audit-level=high
