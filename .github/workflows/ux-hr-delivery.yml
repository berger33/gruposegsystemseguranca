name: UX RH delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/admin/funcionarios/**'
      - 'src/components/ui/**'
      - 'src/lib/hr-vocabulary.*'
      - 'src/lib/hr-request.ts'
      - 'src/styles/ux-tokens.css'
      - 'src/server/employee-api.mjs'
      - 'src/server/hr-api.mjs'
      - 'src/server/hr-termination-api.mjs'
      - 'src/server/rbac.mjs'
      - 'server.mjs'
      - 'tests/helpers/**'
      - 'tests/ux-hr-vocabulary.test.mjs'
      - 'tests/ux-hr-workspace.integration.test.mjs'
      - 'scripts/qa-ux-hr-postgres.mjs'
      - 'scripts/lib/qa-pg-supervisor.mjs'
      - 'scripts/lib/qa-tap-summary.mjs'
      - 'scripts/qa-generated-files-guard.mjs'
      - 'tests/qa-pg-supervisor.test.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/ux-hr-delivery.yml'
concurrency:
  group: ux-hr-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  ux-hr-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      UX_HR_TEST_PATTERN: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guardas do supervisor antes de PG
        run: node --test tests/qa-pg-supervisor.test.mjs
      - name: Verificação de tipos
        run: npm run typecheck
      - name: Vocabulário canônico do RH (sem PostgreSQL)
        run: node --test tests/ux-hr-vocabulary.test.mjs
      - name: UX de RH — HTTP real, PostgreSQL descartável e Chromium
        run: npm run test:ux-hr:pg
