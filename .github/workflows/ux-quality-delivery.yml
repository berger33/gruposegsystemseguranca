name: UX quality delivery
# UX-07 / EXT-05 — gate focal da família QUALIDADE.
# Paths restritos à família e aos arquivos compartilhados REALMENTE tocados
# nesta fatia. `server.mjs`, `src/server/ext-quality-api.mjs` e
# `db/migrations/**` ficam de fora de propósito: nenhum deles foi alterado
# aqui, e nenhuma migração nova foi criada (as 001–174 permanecem intactas).
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/admin/qualidade/**'
      - 'src/lib/quality-vocabulary.*'
      - 'src/lib/quality-request.ts'
      - 'tests/ext05-quality.test.mjs'
      - 'tests/ext05-quality.integration.test.mjs'
      - 'tests/ux-quality-vocabulary.test.mjs'
      - 'tests/ux-quality-workspace.integration.test.mjs'
      - 'scripts/qa-ux-quality-postgres.mjs'
      - 'scripts/ux-evidence-capture.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ux-quality-delivery.yml'
concurrency:
  group: ux-quality-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ux-quality-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # O gate recusa rodar com banco do operador ou remoto; aqui os valores
      # ficam explicitamente vazios.
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/ux-quality-vocabulary.test.mjs
      - run: node --test tests/ext05-quality.test.mjs
      - run: npm run test:ux-quality:pg
