name: UX-11 continuidade delivery
on:
  pull_request:
    paths: ['src/app/admin/continuidade/**','src/lib/continuity-*','tests/ux-continuity-*','scripts/qa-ux-continuity-postgres.mjs','scripts/ux-evidence-capture.mjs','package.json']
  workflow_dispatch:
jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/ux-continuity-vocabulary.test.mjs tests/ext10-continuity.test.mjs
      - run: npm run test:ext10-continuity:pg
      - run: npm run test:ux-continuity:pg
      - run: npm audit --audit-level=high
