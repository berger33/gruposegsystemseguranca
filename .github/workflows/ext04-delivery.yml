name: EXT-04 suppliers delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/server/ext-supplier-api.mjs'
      - 'src/app/admin/fornecedores/**'
      - 'server.mjs'
      - 'tests/ext04-suppliers.test.mjs'
      - 'tests/ext04-suppliers.integration.test.mjs'
      - 'scripts/qa-ext04-suppliers-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'scripts/qa-wave0-static.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/ext04-delivery.yml'
concurrency:
  group: ext04-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  suppliers-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ledger de migrações 001-150 em PostgreSQL descartável
        run: npm run test:migrations:pg
      - name: Jornada EXT-04 (fornecedores internos) por HTTP real contra PostgreSQL real
        run: npm run test:ext04-suppliers:pg
