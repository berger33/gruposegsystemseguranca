name: L06 Operations delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.mjs'
      - 'tests/l06-delivery.integration.test.mjs'
      - 'scripts/qa-l06-delivery-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'scripts/qa-wave0-static.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/l06-delivery.yml'
concurrency:
  group: delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  operations-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Migrations, replay and checksum in disposable PostgreSQL
        run: npm run test:migrations:pg
      - name: L06 real HTTP, disposable PostgreSQL and Chromium
        run: |
          set +e
          npm run test:l06-delivery:pg 2>&1 | tee /tmp/l06.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(grep -aE 'not ok |AssertionError|^# (tests|pass|fail)|Error:|error:|code: ' /tmp/l06.log | head -40 | tr '\n' '~' | cut -c1-4000)
            echo "::error title=L06 gate failure::${summary}"
          fi
          exit "$code"
