name: L06 Operations delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-migrations-postgres.mjs'
      - 'scripts/lib/qa-pg-supervisor.mjs'
      - 'scripts/qa-generated-files-guard.mjs'
      - 'tests/qa-pg-supervisor.test.mjs'
      - 'src/**'
      - 'server.mjs'
      - 'next.config.*'
      - 'tests/helpers/**'
      - 'tests/l06-delivery.integration.test.mjs'
      - 'scripts/qa-l06-delivery-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'scripts/qa-wave0-static.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/l06-delivery.yml'
concurrency:
  group: l06-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  operations-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guardas do supervisor
        run: node --test tests/qa-pg-supervisor.test.mjs
      - name: Migrations, replay and checksum in disposable PostgreSQL
        run: npm run test:migrations:pg
      - name: L06 real HTTP, disposable PostgreSQL and Chromium
        run: npm run test:l06-delivery:pg
