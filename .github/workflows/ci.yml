name: QA baseline

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  static-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DATABASE_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_PUBLIC_ALLOW_INDEX: 'false'
      NEXT_PUBLIC_ENV: 'beta'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check tree, migrations and CI gates
        run: node scripts/qa-wave0-static.mjs
      # Fatia 06B: mapa reproduzível de cobertura. Reprova se um gate voltar a
      # ficar órfão (script existir e nenhum workflow chamar), se um comando
      # apontar para runner/arquivo inexistente, se a indireção não for
      # resolvida ou se o CSV/relatório versionado ficar velho. Custo: leitura
      # de package.json + 60 workflows, sem banco, sem navegador.
      - name: CI coverage equivalence map (no orphan gate, no silent drift)
        run: npm run qa:ci-map:check
      - name: SEC technical re-audit map (anchors + recorded evidence, no human acceptance)
        run: npm run reaudit:sec
      - name: Audit dependencies (moderate and above block)
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (no silent integration skip)
        run: npm test
      # E22: a suíte unitária deixou de depender de AWS_EXECUTION_ENV (o helper
      # injeta o marcador AL2023 antes de importar @sparticuz/chromium). Este
      # gate é o único lugar onde "navegador indisponível" é FALHA explícita,
      # nunca skip: um gate de navegador que pula não prova nada.
      - name: PU4 hermetic browser gate (skip is a failure here)
        run: npm run test:ux-pro-09e-pu4:browser
      # E7: a demo PGlite aplica o schema real (migrações 001–182). O gate sobe
      # PGlite real em diretório temporário e prova schema, idempotência, falha
      # explícita em diretório legado e /api/health/ready saudável.
      - name: E7 PGlite demo schema (real migrations, idempotent, legacy refused)
        run: npm run test:pglite-schema
      - name: UX-PRO-00 inventory precision (isolated fixtures, no bypass)
        run: node --test tests/ux-pro-00-precision.test.mjs
      - name: Administrative navigation catalogue and role-filtered search
        run: node --test tests/admin-navigation.test.mjs
      - name: Build (beta noindex)
        run: npm run build
      - name: RAG integration in isolated CI workspace (PGlite, schema real)
        run: npm run test:rag
      # Fatia 06B: `test:staff-auth:pg` (L01 — identidade, sessão, MFA e
      # revogação por HTTP real) existia desde 04/10 e não era chamado por
      # workflow algum; a falha convivia com a `main` verde porque ninguém
      # executava o gate. Cluster 17 descartável, 21 casos, piso TAP auditado.
      - name: L01 staff identity, session and MFA (embedded PostgreSQL, synthetic)
        timeout-minutes: 10
        run: npm run test:staff-auth:pg
      - name: Tenant A/B HTTP integration (temporary localhost PostgreSQL, migrations 001-007 + 097-098)
        run: npm run test:tenant:pg
      # Fatia 06B: variante `--client-access` do mesmo runner de tenant exercita
      # a jornada do cliente (login individual, escopo de conta) e também não
      # tinha workflow. É outro recorte de jornada, não repetição do anterior.
      - name: Client access end to end (embedded PostgreSQL, synthetic)
        timeout-minutes: 10
        run: npm run test:client-access:pg
      - name: PostgreSQL supervisor fault gates (temporary local clusters, expected failures)
        run: npm run test:pg-supervisor:pg
      - name: QA-HOM-008 persistent synthetic restart (isolated localhost PostgreSQL)
        run: npm run test:demo-local:pg
      - name: CLI-09 portal charges and v2 document aliases (isolated localhost PostgreSQL)
        run: npm run test:cli-v2:pg
      # Fatia 06B: contrato sintético de objeto (bytes v1/v2, recusa cruzada de
      # conta, chave ausente/corrompida) numa segunda execução do runner, com
      # `QA_CLI_V2_OBJECT_CONTRACT=1`. Sem workflow até aqui; cluster próprio.
      - name: CLI-04 synthetic object contract (embedded PostgreSQL, ephemeral key)
        timeout-minutes: 10
        run: npm run test:cli-v2:pg:objects
      # E16: retomada do worker durável (kill real, lease, exactly-once) em
      # PostgreSQL descartável. O gate PGlite não prova contenção entre
      # processos — a sessão única do PGlite não tem com quem competir.
      - name: Durable scheduler resume (PostgreSQL descartavel)
        run: npm run test:durable-scheduler:pg
      # E5: gate que estava órfão (sem npm test, sem workflow). Usa PostgreSQL
      # embutido descartável e dados sintéticos; nenhum skip é aceito aqui.
      - name: Client security regras 005/006 (embedded PostgreSQL, synthetic)
        env:
          N8_TRACE_FILE: ${{ runner.temp }}/n8-client-security-trace.jsonl
        run: RUN_DATABASE_INTEGRATION=1 node --test --test-concurrency=1 tests/client-security.integration.test.mjs
      # N8 residual: o log deste step não é recuperável após a falha. O trace
      # (JSON-lines síncrono, só observação) é publicado também em sucesso, para dar
      # linha de base de tempos. Não altera o resultado do gate.
      - name: Publicar trace N8 do gate client-security
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8-client-security-trace
          path: ${{ runner.temp }}/n8-client-security-trace.jsonl
          if-no-files-found: ignore
          retention-days: 14
