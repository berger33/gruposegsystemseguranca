name: UX-PRO-07D-2 ciencia de escala
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/admin/operacao/**'
      - 'tests/ux-ops-workspace.integration.test.mjs'
      - 'scripts/qa-ux-pro-07d2-postgres.mjs'
      - 'scripts/lib/qa-pg-supervisor.mjs'
      - 'scripts/qa-generated-files-guard.mjs'
      - 'scripts/qa-generated-files.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'tests/qa-pg-supervisor.test.mjs'
      - '.github/workflows/ux-pro-07d2-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash scripts/ci/observed-shell.sh {0}
jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      RUN_DATABASE_INTEGRATION_REMOTE: ''
      ALLOW_REMOTE_MIGRATIONS: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Supervisor PostgreSQL descartável
        run: node --test tests/qa-pg-supervisor.test.mjs
      - run: npm run typecheck
      - name: PostgreSQL descartavel, HTTP real, Chromium e auditoria TAP (minimo 27)
        run: node scripts/qa-ux-pro-07d2-postgres.mjs
