name: L08 client portal delivery
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.mjs'
      - 'next.config.*'
      - 'tests/client-*.integration.test.mjs'
      - 'tests/l08-delivery.integration.test.mjs'
      - 'scripts/qa-l08-delivery-postgres.mjs'
      - 'scripts/migrate-site-visual.mjs'
      - 'db/migrations/**'
      - 'package*.json'
      - '.github/workflows/l08-delivery.yml'
concurrency:
  group: l08-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  client-portal-postgres-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ''
      DATABASE_MIGRATION_URL: ''
      MAIL_HOST: ''
      OLLAMA_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:l08-delivery:pg
